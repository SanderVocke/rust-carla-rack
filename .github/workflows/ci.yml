name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            os: windows
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            os: macos
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Install Linux native dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev

      - name: Locate macOS libclang
        if: matrix.os == 'macos'
        shell: bash
        run: |
          libclang_file="$(find "$(xcode-select -p)" -name libclang.dylib -print -quit)"
          test -n "$libclang_file"
          echo "LIBCLANG_PATH=$(dirname "$libclang_file")" >> "$GITHUB_ENV"

      - name: Locate Windows libclang
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $libclang = Get-ChildItem "C:\Program Files\LLVM" -Filter libclang.dll -Recurse |
            Select-Object -First 1
          if (-not $libclang) {
            throw "libclang.dll was not found"
          }
          "LIBCLANG_PATH=$($libclang.DirectoryName)" >> $env:GITHUB_ENV

      - name: Verify native architecture
        shell: bash
        run: rustc -vV | grep --fixed-strings "host: ${{ matrix.target }}"

      - name: Run tests
        shell: bash
        run: cargo test --locked --workspace --all-targets --target "${{ matrix.target }}"
